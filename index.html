<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <meta name="description" content="Raisa Shopy - Quality Products At Special Prices" > <title>Raisa Shopy</title> <link rel="stylesheet" href="style.css"> </head> <body> <!-- ========================= HEADER ========================== --> <header class="header"> <div class="logo" id="shopName"> Raisa Shopy </div> </header> <!-- ========================= HERO ========================== --> <section class="hero"> <div class="hero-content"> <div class="welcome"> WELCOME TO </div> <h1 id="heroTitle"> Raisa Shopy </h1> <p id="heroText"> Quality Products At Special Prices </p> </div> </section> <!-- ========================= PRODUCT SECTION ========================== --> <main class="product-section"> <!-- ========================= PRODUCT GALLERY ========================== --> <div class="product-gallery"> <div class="main-image-box"> <img id="mainProductImage" src="" alt="Product Image" > </div> <div id="productThumbnails" class="product-thumbnails" ></div> </div> <!-- ========================= PRODUCT INFORMATION ========================== --> <div class="product-info"> <h2 id="productName"> Your Product </h2> <!-- PRICE --> <div class="price-area"> <span id="oldPrice" class="old-price" ></span> <span id="newPrice" class="new-price" > SAR 149.00 </span> <span id="discount" class="discount" ></span> </div> <!-- DESCRIPTION --> <div id="descriptionText" class="description" > Your product description will appear here. </div> <!-- DESCRIPTION IMAGES --> <div id="descriptionImages" class="description-images" ></div> <!-- ========================= PRODUCT VIDEO ========================== --> <div id="videoContainer" class="product-video" style="display:none;" > <video id="productVideo" controls muted playsinline ></video> </div> <!-- ========================= ORDER AREA ========================== --> <div class="order-area"> <h3> 🛒 Order Now </h3> <!-- CUSTOMER NAME --> <label for="customerName"> Your Name </label> <input type="text" id="customerName" placeholder="Enter your name" autocomplete="name" > <!-- PHONE --> <label for="customerPhone"> Phone Number </label> <input type="tel" id="customerPhone" placeholder="Enter your phone number" autocomplete="tel" > <!-- ADDRESS --> <label for="customerAddress"> Delivery Address </label> <textarea id="customerAddress" rows="4" placeholder="Enter your complete delivery address" autocomplete="street-address" ></textarea> <!-- QUANTITY --> <label> Quantity </label> <div class="quantity-box"> <button type="button" id="minusBtn" aria-label="Decrease quantity" > − </button> <input type="number" id="quantity" value="1" min="1" aria-label="Quantity" > <button type="button" id="plusBtn" aria-label="Increase quantity" > + </button> </div> <!-- TOTAL --> <div class="total-price"> <span> Total </span> <strong id="totalPrice"> SAR 149.00 </strong> </div> <!-- WHATSAPP ORDER --> <button type="button" id="orderNow" class="order-button" > <span style=" font-size:22px; vertical-align:middle; margin-right:7px; " > 💬 </span> Order on WhatsApp </button> </div> </div> </main> <!-- ========================= FOOTER ========================== --> <footer> <p id="footerText"> © Raisa Shopy </p> </footer> <!-- ========================= MAIN SCRIPT ========================== --> <script src="script.js"></script> </body> </html>
