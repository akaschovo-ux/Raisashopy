<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raisa Shopy Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="wrap"><div class="card"><h1>Raisa Shopy</h1><p>Admin Login</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Login</button><small id="loginMsg"></small></form></div></div><div id="app" hidden><header><b>Raisa Shopy — Admin</b><button id="logout">Logout</button></header><main><section class="card"><h2>Add Product</h2><form id="productForm"><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" step="0.01" placeholder="Price (SAR)" required><select id="category" required><option value="">Category</option><option>Clothes</option><option>Electronics</option><option>Cosmetics</option><option>Other</option></select><input id="image" type="url" placeholder="Image URL"><textarea id="description" placeholder="Description"></textarea><button>Add Product</button></form></section><section class="card"><h2>Products <span id="count"></span></h2><div id="products"></div></section></main></div><script src="admin.js"></script></body></html>
