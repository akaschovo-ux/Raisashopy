<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raisa Shopy - Admin Login</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <div class="login-box">

    <div class="logo">🛍️</div>

    <h1>Raisa Shopy</h1>
    <h2>Admin Login</h2>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        🔐 LOGIN
      </button>

      <p id="loginMessage"></p>

    </form>

    <a href="../index.html" class="back">
      ← Back to Shop
    </a>

  </div>

  <script src="admin.js"></script>

</body>
</html>
