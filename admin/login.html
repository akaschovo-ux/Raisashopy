<!-- admin/login.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raisa Shopy - Admin Login</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <div class="login-container">
    <div class="login-box">

      <h1>Raisa Shopy</h1>
      <p>Admin Login</p>

      <form id="loginForm">

        <input
          type="text"
          id="username"
          placeholder="Username"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

        <p id="loginMessage"></p>

      </form>

    </div>
  </div>

  <script src="admin.js"></script>

</body>
</html>
