```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raisa Shopy - Admin Login</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <div class="login-page">

    <div class="login-card">

      <div class="login-icon">🛍️</div>

      <h1>Raisa Shopy</h1>

      <p class="login-subtitle">
        Admin Dashboard
      </p>


      <form id="loginForm">

        <label for="email">
          Admin Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter admin email"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >


        <button
          type="submit"
          class="login-btn"
        >
          🔐 Login to Dashboard
        </button>


        <p
          id="loginMessage"
          class="login-message"
        ></p>

      </form>


      <a
        href="../index.html"
        class="back-to-shop"
      >
        ← Back to Shop
      </a>

    </div>

  </div>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginMessage =
      document.getElementById("loginMessage");


    loginForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        if (!email || !password) {

          loginMessage.textContent =
            "Please enter email and password.";

          return;
        }


        sessionStorage.setItem(
          "raisaAdminLoggedIn",
          "true"
        );


        window.location.href =
          "dashboard.html";

      }
    );

  </script>

</body>
</html>
```
